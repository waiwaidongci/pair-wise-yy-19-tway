<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>岩芯薄片树脂封片准入台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <header class="mast">
      <div>
        <p>Petrographic Slide Index · Resin Mount Approval</p>
        <h1>岩芯薄片树脂封片准入台</h1>
      </div>
      <button id="exportBtn" type="button">导出观察清单</button>
    </header>

    <div id="toast" class="toast" hidden></div>

    <section class="layout">
      <div class="left-col">
        <form id="sampleForm" class="editor">
          <h2>样本录入</h2>
          <label>显微照片<input id="photoInput" type="file" accept="image/*"></label>
          <label>样本编号<input name="code" required placeholder="BX-17-03"></label>
          <label>采样地点<input name="location" placeholder="剖面东侧第二层"></label>
          <div class="pair">
            <label>放大倍数<input name="magnification" placeholder="40x"></label>
            <label>偏光类型
              <select name="polarization">
                <option>单偏光</option>
                <option>正交偏光</option>
                <option>反射光</option>
              </select>
            </label>
          </div>
          <label>主要矿物<input name="minerals" placeholder="石英、斜长石、黑云母"></label>
          <label>颗粒结构<input name="texture" placeholder="半自形粒状、碎裂结构"></label>
          <label>老师批注<textarea name="comment" rows="3" placeholder="记录鉴定依据或疑点"></textarea></label>
          <button type="submit">保存样本</button>
        </form>

        <form id="mountForm" class="editor">
          <h2>封片登记 / 变更登记</h2>
          <label>样本
            <select name="sampleId" required></select>
          </label>
          <label>树脂批次<input name="resinBatch" placeholder="如 R-2026-0911"></label>
          <div class="pair">
            <label>批次有效期<input name="resinExpiry" type="date"></label>
            <label>固化温度(℃)<input name="cureTemp" type="number" step="0.1" placeholder="60"></label>
          </div>
          <label>盖玻片编号<input name="coverslipNo" placeholder="如 CG-2408"></label>
          <label>操作人<input name="operator" placeholder="执行封片的人员"></label>
          <label class="revise-only">修订照片（仅变更登记需要）<input name="photo" type="file" accept="image/*"></label>
          <p id="mountHint" class="form-hint">每样本仅允许一张未结束封片单；缺项或批次过期整单拒绝。</p>
          <div id="mountError" class="form-error" hidden></div>
          <div class="pair button-pair">
            <button type="submit" name="mode" value="register">登记封片单</button>
            <button type="submit" name="mode" value="revise" class="secondary">变更登记并重算</button>
          </div>
        </form>
      </div>

      <section class="board">
        <div class="filters">
          <input id="mineralFilter" placeholder="按矿物筛选">
          <select id="polarFilter">
            <option value="">全部偏光</option>
            <option>单偏光</option>
            <option>正交偏光</option>
            <option>反射光</option>
          </select>
          <select id="statusFilter">
            <option value="">全部状态</option>
            <option value="none">未封片</option>
            <option value="open">封片中</option>
            <option value="admitted">已准入</option>
            <option value="failed">不合格</option>
          </select>
        </div>
        <nav class="tabs">
          <button type="button" class="tab active" data-tab="list">样本列表</button>
          <button type="button" class="tab" data-tab="queue">封片队列</button>
          <button type="button" class="tab" data-tab="history">封片履历</button>
        </nav>
        <div id="listView" class="tab-view">
          <div id="sampleGrid" class="sample-grid"></div>
        </div>
        <div id="queueView" class="tab-view" hidden>
          <div id="queuePane" class="queue-pane"></div>
        </div>
        <div id="historyView" class="tab-view" hidden>
          <div id="historyPane" class="history-pane"></div>
        </div>
      </section>

      <aside class="compare">
        <h2>并排对比</h2>
        <p class="form-hint">仅可对比已准入观察的样本。</p>
        <div id="comparePane" class="compare-pane"></div>
      </aside>
    </section>
  </main>
  <script src="./rules.js"></script>
  <script src="./storage.js"></script>
  <script src="./app.js"></script>
</body>
</html>
